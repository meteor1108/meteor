<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>训练预览</title>
<style>
:root{
  color-scheme:dark;
  --bg:#08090b;
  --surface:rgba(28,29,33,.82);
  --surface-strong:rgba(38,39,44,.94);
  --line:rgba(255,255,255,.085);
  --text:#f5f5f7;
  --muted:#98989f;
  --orange:#ff9f0a;
  --green:#30d158;
  --blue:#64d2ff;
  --spring:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:
    radial-gradient(560px 340px at 92% -8%,rgba(255,159,10,.17),transparent 62%),
    radial-gradient(480px 420px at -10% 38%,rgba(48,209,88,.09),transparent 64%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
.app{width:min(100%,430px);min-height:100dvh;margin:0 auto;padding:14px 14px calc(32px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;padding:5px 3px 13px}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:3px}
h1{font-size:31px;line-height:1.02;letter-spacing:-.045em}
.preview-badge{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#b7b7bd;font-size:11px;font-weight:700}
.glass{background:var(--surface);border:1px solid var(--line);box-shadow:0 16px 44px rgba(0,0,0,.24);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;margin-bottom:10px;background:linear-gradient(145deg,rgba(48,49,55,.96),rgba(24,25,29,.92));border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 52px rgba(0,0,0,.3)}
.hero::after{content:"";position:absolute;width:180px;height:180px;right:-82px;top:-85px;border-radius:50%;background:radial-gradient(circle,rgba(255,159,10,.32),transparent 66%);pointer-events:none}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:1}
.hero-kicker{font-size:12px;color:#b6b6bc;margin-bottom:5px}
.hero h2{font-size:27px;letter-spacing:-.035em;margin-bottom:8px}
.hero-meta{display:flex;gap:7px;flex-wrap:wrap}
.hero-meta span{padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.065);font-size:10px;color:#b9b9bf}
.ring{position:relative;width:76px;height:76px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .value{stroke:var(--orange);stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset .55s var(--spring),stroke .25s ease}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:17px;font-weight:760;line-height:1}
.ring-label small{display:block;color:var(--muted);font-size:9px;font-weight:600;margin-top:3px}
.finish-note{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-4px);transition:grid-template-rows .38s var(--spring),opacity .25s,transform .38s var(--spring)}
.finish-note>div{min-height:0;overflow:hidden}
.finish-note.show{grid-template-rows:1fr;opacity:1;transform:none}
.finish-inner{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);color:var(--green);font-size:13px;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;border-radius:18px;margin-bottom:10px}
.day{min-width:0;padding:7px 2px 6px;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:center;transition:transform .16s,background .24s,color .24s}
.day:active{transform:scale(.92)}
.day .wd{font-size:9px;margin-bottom:4px}
.day .num{font-size:13px;font-weight:700}
.day .dot{display:block;width:4px;height:4px;margin:5px auto 0;border-radius:50%;background:#5c5c62}
.day[data-plan="push"] .dot{background:var(--orange)}
.day[data-plan="pull"] .dot{background:var(--green)}
.day[data-plan="legs"] .dot{background:var(--blue)}
.day.today{background:#f5f5f7;color:#111}
.day.today .dot{box-shadow:0 0 0 3px rgba(100,210,255,.18)}
.status{border-radius:18px;margin-bottom:10px;overflow:hidden}
.status-head{width:100%;min-height:54px;padding:0 13px;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer}
.status-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:rgba(100,210,255,.12);color:var(--blue);font-size:14px}
.status-copy{flex:1;min-width:0}
.status-copy strong{display:block;font-size:14px}
.status-copy span{display:block;margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{color:var(--muted);font-size:12px;transition:transform .38s var(--spring)}
.status.open .chevron{transform:rotate(180deg)}
.status-body{display:grid;grid-template-rows:0fr;opacity:0;filter:blur(5px);transform:translateY(-5px);transition:grid-template-rows .42s var(--spring),opacity .24s,filter .25s,transform .42s var(--spring)}
.status-body>div{min-height:0;overflow:hidden}
.status.open .status-body{grid-template-rows:1fr;opacity:1;filter:none;transform:none}
.status-inner{padding:0 13px 13px;border-top:1px solid transparent}
.status.open .status-inner{border-top-color:var(--line);padding-top:11px}
.status-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.status-row:last-child{margin-bottom:0}
.status-label{width:50px;color:var(--muted);font-size:10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1}
.chip{min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:var(--muted);font-size:10px;font-weight:650;cursor:pointer;transition:transform .15s,background .22s,color .22s,border-color .22s}
.chip:active{transform:scale(.92)}
.chip.on{background:rgba(255,159,10,.14);border-color:rgba(255,159,10,.5);color:#ffc46b}
.section-line{display:flex;align-items:flex-end;justify-content:space-between;margin:15px 3px 8px}
.section-line h2{font-size:19px;letter-spacing:-.02em}
.section-line span{font-size:10px;color:var(--muted)}
.rest{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:17px;margin-bottom:10px}
.rest-copy{flex:1;min-width:0}
.rest-copy span{display:block;font-size:9px;color:var(--muted);margin-bottom:2px}
.rest-time{font-size:24px;font-weight:760;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rest-actions{display:flex;gap:5px}
.mini{min-width:42px;height:40px;padding:0 8px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.05);color:var(--text);font-size:10px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s,color .2s}
.mini:active{transform:scale(.9)}
.mini.primary{background:var(--orange);color:#17110a;border-color:var(--orange)}
.prep{display:flex;align-items:center;gap:8px;margin:0 2px 8px;color:var(--muted);font-size:10px}
.prep i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.1)}
.exercise{border-radius:18px;margin-bottom:7px;overflow:hidden;transition:opacity .25s,border-color .25s,background .25s}
.exercise-main{min-height:64px;padding:9px 10px;display:grid;grid-template-columns:44px minmax(0,1fr) auto 15px;align-items:center;gap:9px;cursor:pointer}
.complete{width:44px;height:44px;padding:0;border:2px solid #73737b;border-radius:14px;background:transparent;color:transparent;font-size:20px;font-weight:800;cursor:pointer;transition:transform .16s var(--spring),background .22s,border-color .22s,color .22s,box-shadow .22s}
.complete:active{transform:scale(.87)}
.exercise.done{opacity:.62}
.exercise.done .complete{background:var(--green);border-color:var(--green);color:#071109;box-shadow:0 0 0 5px rgba(48,209,88,.08)}
.ex-info{min-width:0}
.ex-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weight{display:flex;align-items:center;gap:3px}
.weight button{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04);color:#bdbdc3;font-size:15px;cursor:pointer;transition:transform .15s,background .2s}
.weight button:active{transform:scale(.88)}
.weight strong{min-width:45px;text-align:center;color:var(--orange);font-size:13px;font-variant-numeric:tabular-nums}
.ex-arrow{color:#6e6e75;font-size:10px;transition:transform .35s var(--spring)}
.exercise.open .ex-arrow{transform:rotate(180deg)}
.exercise-detail{display:grid;grid-template-rows:0fr;opacity:0;filter:blur(4px);transform:translateY(-4px);transition:grid-template-rows .4s var(--spring),opacity .22s,filter .24s,transform .4s var(--spring)}
.exercise-detail>div{min-height:0;overflow:hidden}
.exercise.open .exercise-detail{grid-template-rows:1fr;opacity:1;filter:none;transform:none}
.detail-inner{padding:0 10px}
.exercise.open .detail-inner{padding-bottom:10px}
.sets{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:5px}
.set{display:grid;grid-template-columns:42px 32px 1fr 1fr;gap:5px;align-items:center}
.set-check{height:34px;border:1px solid rgba(255,159,10,.45);border-radius:9px;background:rgba(255,159,10,.1);color:#ffc46b;font-size:10px;font-weight:700;cursor:pointer}
.set-check.done{background:var(--green);border-color:var(--green);color:#071109}
.set b{font-size:10px;color:var(--muted);text-align:center}
.set span{padding:8px 5px;border-radius:9px;background:rgba(255,255,255,.04);font-size:10px;text-align:center;color:#c6c6cb}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:999px;background:rgba(245,245,247,.94);color:#1d1d1f;font-size:12px;font-weight:700;box-shadow:0 12px 34px rgba(0,0,0,.4);opacity:0;transform:translate(-50%,10px) scale(.96);pointer-events:none;white-space:nowrap}
.toast.show{animation:toastIn 1.35s var(--spring)}
.pop{animation:pop .42s var(--spring)}
.preview-note{text-align:center;color:#66666d;font-size:9px;margin-top:14px}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,10px) scale(.96)}16%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-5px) scale(.98)}}
@keyframes pop{0%{transform:scale(.82)}58%{transform:scale(1.08)}100%{transform:scale(1)}}
@media(max-width:370px){
  .app{padding-left:10px;padding-right:10px}
  .hero{padding:16px}
  .exercise-main{grid-template-columns:42px minmax(0,1fr) auto 12px;gap:7px}
  .complete{width:42px;height:42px}
  .weight button{width:28px}
  .weight strong{min-width:40px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div><div class="eyebrow" id="dateLabel">今天</div><h1>训练</h1></div>
    <span class="preview-badge">交互预览</span>
  </header>

  <section class="hero">
    <div class="hero-row">
      <div>
        <div class="hero-kicker">今日计划</div>
        <h2>腿部力量</h2>
        <div class="hero-meta"><span>5 个动作</span><span>13 个正式组</span><span>约 62 分钟</span></div>
      </div>
      <div class="ring" aria-label="训练完成进度">
        <svg viewBox="0 0 76 76"><circle class="track" cx="38" cy="38" r="30"></circle><circle class="value" id="progressRing" cx="38" cy="38" r="30"></circle></svg>
        <div class="ring-label"><div><span id="progressCount">0</span>/5<small>已完成</small></div></div>
      </div>
    </div>
    <div class="finish-note" id="finishNote"><div><div class="finish-inner">今日训练完成 ✓</div></div></div>
  </section>

  <section class="week glass" id="week" aria-label="本周训练"></section>

  <section class="status glass" id="statusCard">
    <button class="status-head" id="statusToggle" type="button" aria-expanded="false">
      <span class="status-icon">◌</span>
      <span class="status-copy"><strong>今日状态</strong><span id="statusSummary">未填写 · 点此展开</span></span>
      <span class="chevron">⌄</span>
    </button>
    <div class="status-body"><div><div class="status-inner">
      <div class="status-row"><span class="status-label">睡眠</span><div class="chips" data-group="sleep"><button class="chip">不足6h</button><button class="chip">6–8h</button><button class="chip">8h以上</button></div></div>
      <div class="status-row"><span class="status-label">酸痛</span><div class="chips" data-group="sore"><button class="chip">无</button><button class="chip">轻微</button><button class="chip">明显</button></div></div>
      <div class="status-row"><span class="status-label">不适</span><div class="chips" data-group="pain"><button class="chip">无</button><button class="chip">有</button><button class="chip">跳过训练</button></div></div>
    </div></div></div>
  </section>

  <div class="section-line"><h2>今日动作</h2><span id="doneText">0 / 5 完成</span></div>

  <section class="rest glass">
    <div class="rest-copy"><span>组间休息 · 完成一组后自动开始</span><div class="rest-time" id="restTime">00:00</div></div>
    <div class="rest-actions"><button class="mini" id="restAdd" type="button">+30</button><button class="mini primary" id="restPause" type="button">开始</button><button class="mini" id="restSkip" type="button">跳过</button></div>
  </section>

  <div class="prep"><i></i><span>热身约 5–8 分钟 · 第一项含 3 组递增热身</span></div>
  <section id="exerciseList"></section>
  <div class="preview-note">仅用于确认训练界面与动效，不写入正式数据</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const exercises=[
  {name:'杠铃深蹲',meta:'3组 × 8–10次 · 股四头 / 臀',weight:40,step:2.5,sets:3,reps:'8–10',rir:2},
  {name:'杠铃罗马尼亚硬拉',meta:'3组 × 8–12次 · 腘绳 / 臀',weight:40,step:2.5,sets:3,reps:'8–12',rir:2},
  {name:'保加利亚分腿蹲',meta:'2组 × 每腿8–12次 · 股四头 / 臀',weight:7.5,step:2.5,sets:2,reps:'8–12',rir:2},
  {name:'坐姿腿弯举',meta:'2组 × 10–15次 · 腘绳肌',weight:20,step:5,sets:2,reps:'10–15',rir:2},
  {name:'站姿提踵',meta:'2组 × 10–15次 · 小腿',weight:15,step:2.5,sets:2,reps:'10–15',rir:2}
];
const completed=new Set();
let toastTimer=null,restSeconds=0,restTimer=null,restPaused=true;
const weekdays=['日','一','二','三','四','五','六'];
const plans=['push','pull','legs','rest'];

function showToast(text){
  const el=document.getElementById('toast');
  el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1400);
}
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),480)}
function fmtWeight(value){return (Number.isInteger(value)?value:value.toFixed(1))+'kg'}
function renderWeek(){
  const now=new Date(),day=now.getDay();
  document.getElementById('dateLabel').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日 · 星期'+weekdays[day];
  document.getElementById('week').innerHTML=Array.from({length:7},(_,i)=>{
    const date=new Date(now);date.setDate(now.getDate()-day+i);
    const plan=plans[((i+1)%4)];
    return `<button class="day ${i===day?'today':''}" data-plan="${plan}" type="button"><div class="wd">${weekdays[i]}</div><div class="num">${date.getDate()}</div><i class="dot"></i></button>`;
  }).join('');
}
function setRows(ex){
  return Array.from({length:ex.sets},(_,i)=>`<div class="set"><button class="set-check" type="button">完成</button><b>正${i+1}</b><span>${fmtWeight(ex.weight)} × ${ex.reps}</span><span>RIR ${ex.rir}</span></div>`).join('');
}
function renderExercises(){
  document.getElementById('exerciseList').innerHTML=exercises.map((ex,i)=>`<article class="exercise glass ${completed.has(i)?'done':''}" data-index="${i}">
    <div class="exercise-main">
      <button class="complete" type="button" aria-label="${completed.has(i)?'取消完成':'完成'} ${ex.name}">✓</button>
      <div class="ex-info"><div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.meta}</div></div>
      <div class="weight"><button type="button" data-delta="-1" aria-label="减重量">−</button><strong>${fmtWeight(ex.weight)}</strong><button type="button" data-delta="1" aria-label="加重量">＋</button></div>
      <span class="ex-arrow">⌄</span>
    </div>
    <div class="exercise-detail"><div><div class="detail-inner"><div class="sets">${setRows(ex)}</div></div></div></div>
  </article>`).join('');
  updateProgress();
}
function updateProgress(){
  const done=completed.size,pct=done/exercises.length;
  document.getElementById('progressCount').textContent=done;
  document.getElementById('doneText').textContent=done+' / '+exercises.length+' 完成';
  document.getElementById('progressRing').style.strokeDashoffset=188.5*(1-pct);
  document.getElementById('finishNote').classList.toggle('show',done===exercises.length);
}
function paintRest(){
  document.getElementById('restTime').textContent=String(Math.floor(restSeconds/60)).padStart(2,'0')+':'+String(restSeconds%60).padStart(2,'0');
}
function ensureTimer(){
  if(restTimer)return;
  restTimer=setInterval(()=>{if(restPaused||restSeconds<=0)return;restSeconds--;paintRest();if(restSeconds===0){restPaused=true;document.getElementById('restPause').textContent='开始';showToast('休息结束，可以开始下一组');}},1000);
}

document.getElementById('statusToggle').addEventListener('click',()=>{
  const card=document.getElementById('statusCard'),open=card.classList.toggle('open');
  document.getElementById('statusToggle').setAttribute('aria-expanded',String(open));
});
document.querySelectorAll('.chips').forEach(group=>group.addEventListener('click',event=>{
  const chip=event.target.closest('.chip');if(!chip)return;
  group.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===chip));
  const selected=[...document.querySelectorAll('.chip.on')].map(x=>x.textContent);
  document.getElementById('statusSummary').textContent=selected.length?selected.join(' · '):'未填写 · 点此展开';
  showToast('今日状态已更新');
}));
document.getElementById('week').addEventListener('click',event=>{
  const day=event.target.closest('.day');if(!day)return;
  document.querySelectorAll('.day').forEach(x=>x.classList.toggle('today',x===day));
  showToast('已切换日期预览');
});
document.getElementById('exerciseList').addEventListener('click',event=>{
  const card=event.target.closest('.exercise');if(!card)return;
  const index=Number(card.dataset.index),ex=exercises[index];
  const complete=event.target.closest('.complete');
  const weightButton=event.target.closest('.weight button');
  const setButton=event.target.closest('.set-check');
  if(complete){
    if(completed.has(index))completed.delete(index);else completed.add(index);
    complete.classList.add('pop');renderExercises();
    const fresh=document.querySelector(`.exercise[data-index="${index}"] .complete`);pop(fresh);
    showToast(ex.name+(completed.has(index)?' · 已完成':' · 已撤销'));return;
  }
  if(weightButton){
    ex.weight=Math.max(ex.step,ex.weight+Number(weightButton.dataset.delta)*ex.step);
    renderExercises();
    const fresh=document.querySelector(`.exercise[data-index="${index}"] .weight strong`);pop(fresh);
    showToast(ex.name+' · '+fmtWeight(ex.weight));return;
  }
  if(setButton){
    setButton.classList.toggle('done');setButton.textContent=setButton.classList.contains('done')?'✓':'完成';
    pop(setButton);restSeconds=90;restPaused=false;paintRest();ensureTimer();document.getElementById('restPause').textContent='暂停';showToast('本组已完成 · 开始休息');return;
  }
  document.querySelectorAll('.exercise.open').forEach(x=>{if(x!==card)x.classList.remove('open')});
  card.classList.toggle('open');
});
document.getElementById('restAdd').addEventListener('click',()=>{restSeconds+=30;paintRest();pop(document.getElementById('restTime'));showToast('休息时间 +30秒')});
document.getElementById('restPause').addEventListener('click',event=>{
  if(restSeconds===0)restSeconds=90;
  restPaused=!restPaused;event.currentTarget.textContent=restPaused?'继续':'暂停';paintRest();ensureTimer();showToast(restPaused?'休息已暂停':'休息继续');
});
document.getElementById('restSkip').addEventListener('click',()=>{restSeconds=0;restPaused=true;paintRest();document.getElementById('restPause').textContent='开始';showToast('已跳过休息')});

renderWeek();renderExercises();paintRest();
</script>
</body>
</html>
